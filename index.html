<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geovisor Pisba</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
<style>
  html, body, #map { width:100%; height:100%; margin:0; padding:0; }
  .leaflet-container { font-size:1rem; }
  .foliumtooltip { font:12px Arial; padding:4px 6px; }
  .foliumtooltip table { margin:auto; }
  .foliumtooltip tr { text-align:left; }
  .foliumtooltip th { padding:2px 8px 2px 2px; }
  #estado { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#fff; padding:6px 12px;
    border-radius:4px; box-shadow:0 0 8px rgba(0,0,0,.3); z-index:1000; font:13px Arial; }
</style>
</head>
<body>
<div id="map"></div>
<div id="estado">Cargando polígono…</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
(function () {
  var map = L.map('map', { center: [5.9455, -72.5803], zoom: 11 });
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community' });
  var carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>' });

  var poligono = L.geoJson(null, {
    style: function () { return { color: 'red', fillOpacity: 0, weight: 2 }; },
    onEachFeature: function (f, layer) {
      layer.bindTooltip('<table><tr><th>Nombre:</th><td>' + f.properties.par_nom_co + '</td></tr></table>',
        { sticky: true, className: 'foliumtooltip' });
    }
  }).addTo(map);

  L.control.layers(
    { 'OpenStreetMap': osm, 'ESRI Satélite': esri, 'Carto Claro': carto },
    { 'Pisba': poligono },
    { position: 'topright', collapsed: false }
  ).addTo(map);

  fetch('pisba.geojson')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { poligono.addData(d); document.getElementById('estado').remove(); })
    .catch(function (e) { document.getElementById('estado').textContent = 'No se pudo cargar pisba.geojson (' + e.message + ')'; });
})();
</script>
</body>
</html>
